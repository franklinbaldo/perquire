[project]
name = "perquire"
version = "0.2.0"
description = "Experimental similarity-guided semantic inversion in a known embedding space"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
keywords = ["embeddings", "semantic-search", "semantic-inversion", "llm"]
authors = [{name = "Franklin Baldo"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=2.3.1",
    "typer>=0.12.0",
    "rich>=14.0.0",
]

[project.optional-dependencies]
persistence = ["duckdb>=1.3.0", "pandas>=2.3.0"]
vss = ["duckdb>=1.3.0", "pandas>=2.3.0", "duckdb-extension-vss>=1.3.0"]
web = ["fastapi>=0.111.0", "uvicorn[standard]>=0.30.0", "Jinja2>=3.1.0"]
analysis = ["scikit-learn>=1.7.0"]
api-openai = [
    "llama-index-core>=0.12.45",
    "llama-index-embeddings-openai>=0.3.1",
    "llama-index-llms-openai>=0.4.7",
]
api-gemini = [
    "google-generativeai>=0.8.5",
    "llama-index-core>=0.12.45",
    "llama-index-embeddings-gemini>=0.3.2",
    "llama-index-llms-gemini>=0.5.0",
]
api-anthropic = [
    "anthropic>=0.56.0",
    "llama-index-core>=0.12.45",
    "llama-index-llms-anthropic>=0.7.5",
]
api-openrouter = ["litellm==1.97.0"]
api-ollama = ["llama-index-core>=0.12.45", "llama-index-llms-ollama>=0.6.2"]
pydantic-ai = ["pydantic-ai>=0.0.14"]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
perquire = "perquire.cli.main:app"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["."]
