name: OpenRouter reliability observatory v2

# Target-free longitudinal qualification for scaling v2.
# 24 windows/day x <=40 inference calls/window = <=960 free calls/day maximum.
# Minute 17 avoids top-of-hour congestion while preserving hourly coverage.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  pull_request:

concurrency:
  group: openrouter-reliability-observatory-v2-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  observe:
    if: github.event_name != 'pull_request' || github.head_ref == 'experiment/reliability-acceptance-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.5'
          enable-cache: true
      - name: Require OpenRouter credential
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: test -n "${OPENROUTER_API_KEY}" || { echo '::error::OPENROUTER_API_KEY missing'; exit 1; }
      - name: Sync frozen OpenRouter boundary
        run: uv sync --python 3.12.13 --extra api-openrouter --frozen
      - name: Run one target-free qualification and observation window
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          uv run --python 3.12.13 python -m benchmarks.probe_openrouter_reliability_v2 \
            --window-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output "benchmark_results/openrouter_reliability_v2_${stamp}.json"
      - name: Require one 20/20 observation window
        if: github.event_name == 'pull_request'
        run: |
          uv run --python 3.12.13 python - <<'PY'
          import json
          from pathlib import Path

          files = sorted(Path('benchmark_results').glob('openrouter_reliability_v2_*.json'))
          assert len(files) == 1, files
          data = json.loads(files[0].read_text())
          calls = data['observation_calls']
          successes = sum(bool(call['success']) for call in calls)
          total = len(calls)
          print(f"selected_model={data.get('selected_model')} acceptance successes={successes}/{total}")
          if total != 20 or successes != total:
              raise SystemExit(1)
          PY
      - name: Upload observation window
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openrouter-reliability-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: benchmark_results/openrouter_reliability_v2_*.json
          if-no-files-found: error
          retention-days: 30
