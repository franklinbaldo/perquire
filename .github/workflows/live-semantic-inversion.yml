name: Live semantic inversion benchmark

on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Require a provider credential
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "::error::OPENROUTER_API_KEY is empty. Add the repository secret before running the live benchmark."
            exit 1
          fi
          echo "Provider credential present."

      - name: Install Perquire with OpenRouter providers
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[api-openrouter]'

      - name: Run benchmark v1
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python -m benchmarks.run_semantic_inversion \
            --llm-provider openrouter \
            --embedding-provider openrouter \
            --budget 6 \
            --output benchmark_results/semantic_inversion_v1.json

      - name: Upload auditable benchmark result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-inversion-v1
          path: benchmark_results/semantic_inversion_v1.json
          if-no-files-found: warn
          retention-days: 30
