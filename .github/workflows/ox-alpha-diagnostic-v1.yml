name: Ox Alpha target-free diagnostic v1

# The diagnostic matrix in benchmarks/ox_alpha_diagnostic_v1.json is preregistered
# and frozen. Repeating it on a schedule and then picking a run would reintroduce
# the degrees of freedom the freeze exists to remove, so the schedule is
# self-terminating: it retries only until one run succeeds, and the first
# successful run is the authoritative evidence for issue #79.
on:
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:

concurrency:
  group: ox-alpha-diagnostic-v1
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
    steps:
      - name: Skip the schedule once authoritative evidence exists
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" != "schedule" ]; then
            echo 'manual dispatch: running regardless of prior runs'
            echo 'should_run=true' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          successes="$(gh run list \
            --workflow ox-alpha-diagnostic-v1.yml \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq 'length')"
          if [ "${successes}" -gt 0 ]; then
            echo 'a successful diagnostic run already exists; the schedule stands down'
            echo 'should_run=false' >> "${GITHUB_OUTPUT}"
          else
            echo 'no successful diagnostic run yet; collecting evidence'
            echo 'should_run=true' >> "${GITHUB_OUTPUT}"
          fi

  diagnose:
    needs: guard
    if: needs.guard.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.5'
          enable-cache: true
      - name: Sync frozen OpenRouter boundary
        run: uv sync --python 3.12.13 --extra api-openrouter --frozen
      - name: Require OpenRouter credential
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: test -n "${OPENROUTER_API_KEY}" || { echo '::error::OPENROUTER_API_KEY missing'; exit 1; }
      - name: Run preregistered target-free diagnostic
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          uv run --python 3.12.13 python -m benchmarks.diagnose_ox_alpha \
            --config benchmarks/ox_alpha_diagnostic_v1.json \
            --output benchmark_results/ox_alpha_diagnostic_v1.json
      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ox-alpha-diagnostic-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: benchmark_results/ox_alpha_diagnostic_v1.json
          if-no-files-found: error
          retention-days: 90
