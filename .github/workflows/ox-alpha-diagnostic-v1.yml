name: Ox Alpha target-free diagnostic v1

# Recurring target-free collection for issue #79. Each run is an independent
# window over the frozen matrix in benchmarks/ox_alpha_diagnostic_v1.json and is
# uploaded under its own timestamped artifact, so windows accumulate instead of
# overwriting one another.
on:
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:

concurrency:
  group: ox-alpha-diagnostic-v1
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.5'
          enable-cache: true
      - name: Sync frozen OpenRouter boundary
        run: uv sync --python 3.12.13 --extra api-openrouter --frozen
      - name: Require OpenRouter credential
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: test -n "${OPENROUTER_API_KEY}" || { echo '::error::OPENROUTER_API_KEY missing'; exit 1; }
      - name: Run preregistered target-free diagnostic
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          uv run --python 3.12.13 python -m benchmarks.diagnose_ox_alpha \
            --config benchmarks/ox_alpha_diagnostic_v1.json \
            --output "benchmark_results/ox_alpha_diagnostic_v1_${stamp}.json"
      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ox-alpha-diagnostic-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: benchmark_results/ox_alpha_diagnostic_v1_*.json
          if-no-files-found: error
          retention-days: 90
