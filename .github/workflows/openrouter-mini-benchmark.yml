name: OpenRouter mini semantic benchmark

on:
  push:
    branches: [exp/openrouter-mini-benchmark]
    paths:
      - '.github/workflows/openrouter-mini-benchmark.yml'
  workflow_dispatch:

jobs:
  mini:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Require OpenRouter credential
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          test -n "${OPENROUTER_API_KEY}" || { echo '::error::OPENROUTER_API_KEY missing'; exit 1; }

      - name: Install only OpenRouter boundary
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[api-openrouter]'

      - name: Run three-case budget-3 mini benchmark
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python -m benchmarks.run_semantic_inversion \
            --llm-provider openrouter \
            --embedding-provider openrouter \
            --limit 3 \
            --budget 3 \
            --output benchmark_results/openrouter_mini.json

      - name: Summarize mini evidence
        run: |
          python - <<'PY'
          import json
          from collections import defaultdict
          from pathlib import Path
          data = json.loads(Path('benchmark_results/openrouter_mini.json').read_text())
          assert data['case_count'] == 3
          assert data['budget'] == 3
          assert len(data['records']) == 9
          scores = defaultdict(list)
          calls = defaultdict(int)
          for r in data['records']:
              assert r['evaluations'] == 3
              scores[r['method']].append(r['best_target_similarity'])
              calls[r['method']] += r['llm_calls']
          print('MINI_BENCHMARK_OK')
          for method in sorted(scores):
              mean = sum(scores[method]) / len(scores[method])
              print(method, 'mean_best=', round(mean, 6), 'llm_calls=', calls[method])
          PY

      - name: Upload mini evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openrouter-mini-benchmark
          path: benchmark_results/openrouter_mini.json
          if-no-files-found: warn
          retention-days: 30
