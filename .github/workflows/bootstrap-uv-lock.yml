name: Bootstrap uv lock

on:
  push:
    branches: [chore/uv-freeze-v1]

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/uv-freeze-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Resolve lock from the recovered v1 boundary
        run: uv lock --python 3.12.13
      - name: Verify experiment-critical versions
        run: |
          uv sync --extra api-openrouter --frozen
          uv run python - <<'PY'
          import importlib.metadata as metadata
          import platform

          expected = {
              'litellm': '1.97.0',
              'numpy': '2.5.2',
              'openai': '2.54.0',
              'httpx': '0.28.1',
              'httpcore': '1.0.9',
              'pydantic': '2.13.4',
              'pydantic-core': '2.46.4',
              'pydantic-settings': '2.15.0',
              'aiohttp': '3.14.3',
              'tiktoken': '0.14.0',
              'tokenizers': '0.23.1',
          }
          assert platform.python_version() == '3.12.13'
          mismatches = {
              name: (version, metadata.version(name))
              for name, version in expected.items()
              if metadata.version(name) != version
          }
          if mismatches:
              raise SystemExit(f'uv lock drifted from recovered v1 environment: {mismatches}')
          print('SCALING_V1_ENVIRONMENT_MATCH')
          PY
      - name: Commit generated lock
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add uv.lock
          git diff --cached --quiet && exit 0
          git commit -m 'build: lock scaling v1 Python environment'
          git push origin HEAD:chore/uv-freeze-v1
