name: Semantic Atlas DGCT local v1.1

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/semantic-atlas-dgct-local-v1-1.yml'
      - 'docs/experiments/semantic_atlas_dgct_local_v1_1.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semantic-atlas-dgct-local-v1-1
  cancel-in-progress: false

jobs:
  dgct:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      TRANSFORMERS_CACHE: ${{ github.workspace }}/.cache/huggingface/transformers
      SENTENCE_TRANSFORMERS_HOME: ${{ github.workspace }}/.cache/sentence-transformers
    steps:
      - name: Checkout Perquire
        uses: actions/checkout@v4

      - name: Checkout frozen papers DGCT v1.1
        uses: actions/checkout@v4
        with:
          repository: franklinbaldo/papers
          ref: 0f4e8f6b117a8f461b0253f2b072269968dac8a1
          path: papers-src
          fetch-depth: 0

      - name: Verify frozen papers commit
        run: |
          test "$(git -C papers-src rev-parse HEAD)" = "0f4e8f6b117a8f461b0253f2b072269968dac8a1"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.5'
          enable-cache: true

      - name: Restore Hugging Face model cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/huggingface
            .cache/sentence-transformers
          key: semantic-atlas-dgct-local-v1-${{ runner.os }}-qwen3-06b-minilm
          restore-keys: |
            semantic-atlas-dgct-local-v1-${{ runner.os }}-

      - name: Install frozen experiment dependencies
        working-directory: papers-src/experiments/semantic_atlas
        run: |
          uv venv --python 3.11
          uv pip install --python .venv/bin/python -e '.[models]'

      - name: Run frozen Dynamic Gauge Compression Test v1.1
        working-directory: papers-src/experiments/semantic_atlas
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: .venv/bin/python scripts/run_dynamic_gauge_compression_v1_1.py

      - name: Print scientific summary
        if: success()
        working-directory: papers-src/experiments/semantic_atlas
        run: |
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path

          p = Path('artifacts/dynamic_gauge_compression_v1_1.json')
          d = json.loads(p.read_text())
          print(json.dumps(d['raw_cross_model_test_dynamics'], indent=2))
          print(json.dumps({
              k: {
                  'reference_test_energy_ratio': v['reference_observer']['test_energy_ratio'],
                  'transfer_test_energy_ratio': v['transfer_observer']['test_energy_ratio'],
                  'cross_model_delta': v['cross_model']['delta'],
              }
              for k, v in d['fields'].items()
          }, indent=2))
          PY

      - name: Upload frozen DGCT v1.1 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-atlas-dgct-local-v1-1-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            papers-src/experiments/semantic_atlas/artifacts/dynamic_gauge_compression_v1_1.json
            papers-src/experiments/semantic_atlas/dynamic_gauge_compression_v1_1.json
            papers-src/experiments/semantic_atlas/protocol_dynamic_gauge_compression_v1_1.md
            docs/experiments/semantic_atlas_dgct_local_v1_1.md
          if-no-files-found: warn
          retention-days: 90
