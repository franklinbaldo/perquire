name: OpenRouter embedding calibration v1

on:
  pull_request:

permissions:
  contents: read

jobs:
  calibrate:
    if: >-
      github.head_ref == 'experiment/scaling-v1-primary' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PERQUIRE_CACHE_DIR: .cache/perquire

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'

      - name: Restore accumulated v1 cache from this PR ref
        uses: actions/cache/restore@v4
        with:
          path: .cache/perquire
          key: calibrate-scaling-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            perquire-scaling-v1-${{ runner.os }}-
            perquire-embeddings-v1-${{ runner.os }}-

      - name: Require cached targets and OpenRouter credential
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          test -f .cache/perquire/embeddings.sqlite3 || { echo '::error::Embedding cache is missing from the scaling-v1 PR scope'; exit 1; }
          test -n "${OPENROUTER_API_KEY}" || { echo '::error::OPENROUTER_API_KEY missing'; exit 1; }

      - name: Install recovered v1 provider boundary
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps
          python -m pip install \
            'numpy==2.5.2' \
            'rich==15.0.0' \
            'typer==0.27.1' \
            'litellm==1.97.0' \
            'openai==2.54.0' \
            'httpx==0.28.1' \
            'httpcore==1.0.9' \
            'pydantic==2.13.4' \
            'pydantic-core==2.46.4' \
            'pydantic-settings==2.15.0' \
            'aiohttp==3.14.3' \
            'tiktoken==0.14.0' \
            'tokenizers==0.23.1'

      - name: Verify recovered critical versions
        run: |
          python - <<'PY'
          import importlib.metadata as metadata
          import platform
          expected = {
              'litellm': '1.97.0',
              'numpy': '2.5.2',
              'openai': '2.54.0',
              'httpx': '0.28.1',
              'httpcore': '1.0.9',
              'pydantic': '2.13.4',
              'pydantic-core': '2.46.4',
              'pydantic-settings': '2.15.0',
              'aiohttp': '3.14.3',
              'tiktoken': '0.14.0',
              'tokenizers': '0.23.1',
          }
          assert platform.python_version() == '3.12.13'
          mismatches = {name: (version, metadata.version(name)) for name, version in expected.items() if metadata.version(name) != version}
          if mismatches:
              raise SystemExit(f'v1 environment drift before calibration: {mismatches}')
          print('SCALING_V1_CALIBRATION_ENVIRONMENT_MATCH')
          PY

      - name: Run drift control then fixed-paraphrase calibration
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python -m benchmarks.check_embedding_drift_and_calibrate \
            --output benchmark_results/embedding_drift_calibration_v1.json

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: embedding-drift-calibration-v1-${{ github.run_id }}
          path: benchmark_results/embedding_drift_calibration_v1.json
          if-no-files-found: warn
          retention-days: 90
