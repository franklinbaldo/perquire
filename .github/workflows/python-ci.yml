name: Python CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12.13", "3.13.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync minimal core from lock
        run: uv sync --python '${{ matrix.python-version }}' --frozen
      - name: Prove import boundary
        run: |
          uv run --python '${{ matrix.python-version }}' python - <<'PY'
          import importlib.util
          import perquire
          from perquire.embeddings.utils import cosine_similarity
          assert importlib.util.find_spec("duckdb") is None
          assert importlib.util.find_spec("fastapi") is None
          assert importlib.util.find_spec("sklearn") is None
          assert perquire.__version__ == "0.2.0"
          PY
      - name: Test core contract
        run: uv run --python '${{ matrix.python-version }}' pytest tests/core tests/convergence tests/cli tests/benchmarks

  persistence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync persistence boundary from lock
        run: uv sync --python 3.12.13 --extra persistence --frozen
      - name: Test persistence contract
        run: uv run --python 3.12.13 pytest tests/database

  providers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync OpenRouter boundary from lock
        run: uv sync --python 3.12.13 --extra api-openrouter --frozen
      - name: Test provider adapters
        run: uv run --python 3.12.13 pytest tests/providers

  web-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync web boundary from lock
        run: uv sync --python 3.12.13 --extra web --extra persistence --frozen
      - name: Test rendered web surface
        run: uv run --python 3.12.13 pytest tests/test_web_surface.py
