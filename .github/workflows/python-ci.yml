name: Python CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install minimal core
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest
      - name: Prove import boundary
        run: |
          python - <<'PY'
          import importlib.util
          import perquire
          from perquire.embeddings.utils import cosine_similarity
          assert importlib.util.find_spec("duckdb") is None
          assert importlib.util.find_spec("fastapi") is None
          assert importlib.util.find_spec("sklearn") is None
          assert perquire.__version__ == "0.2.0"
          PY
      - name: Test core contract
        run: pytest tests/core tests/convergence tests/cli

  persistence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install persistence boundary
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[persistence]' pytest
      - name: Test persistence contract
        run: pytest tests/database

  web-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install web boundary
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[web,persistence]' pytest
      - name: Test rendered web surface
        run: pytest tests/test_web_surface.py
