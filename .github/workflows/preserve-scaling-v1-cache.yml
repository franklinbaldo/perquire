name: Preserve scaling v1 cache

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preserve-cache:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.head_ref == 'claude/perquire-openrouter-limit-nt788x' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      PERQUIRE_CACHE_DIR: .cache/perquire

    steps:
      - uses: actions/checkout@v4

      - name: Restore accumulated v1 cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/perquire
          key: preserve-scaling-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            perquire-scaling-v1-${{ runner.os }}-
            perquire-embeddings-v1-${{ runner.os }}-
            perquire-scaling-smoke-v2-${{ runner.os }}-

      - name: Verify restored cache
        run: |
          test -d .cache/perquire || { echo '::error::No Perquire cache was restored'; exit 1; }
          test -f .cache/perquire/embeddings.sqlite3 || { echo '::error::Embedding cache is missing'; exit 1; }
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          path = Path('.cache/perquire/embeddings.sqlite3')
          with sqlite3.connect(path) as db:
              result = db.execute('PRAGMA integrity_check').fetchone()[0]
              if result != 'ok':
                  raise SystemExit(f'cache integrity check failed: {result}')
          print('SCALING_V1_CACHE_RESTORED', path.stat().st_size)
          PY

      - name: Upload durable v1 cache snapshot
        uses: actions/upload-artifact@v4
        with:
          name: scaling-v1-cache-snapshot-${{ github.run_id }}
          path: .cache/perquire
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
