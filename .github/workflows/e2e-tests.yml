name: Perquire E2E Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  end-to-end-test:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12.13'
    - uses: astral-sh/setup-uv@v6
      with:
        version: '0.12.5'
        enable-cache: true
    - name: Sync dependencies from lock
      run: uv sync --python 3.12.13 --frozen
    - name: Run E2E Tests
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: uv run --python 3.12.13 python tests/e2e/run_e2e_tests.py

  openrouter-smoke:
    if: >-
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[openrouter-smoke]')) ||
      (github.event_name == 'pull_request' && github.head_ref == 'ci/openrouter-visible-live-smoke' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PERQUIRE_CACHE_DIR: .cache/perquire
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12.13'
    - uses: astral-sh/setup-uv@v6
      with:
        version: '0.12.5'
        enable-cache: true
    - name: Restore accumulated embedding cache
      uses: actions/cache@v4
      with:
        path: .cache/perquire
        key: perquire-embeddings-v1-${{ runner.os }}-${{ github.run_id }}
        restore-keys: |
          perquire-embeddings-v1-${{ runner.os }}-
    - name: Sync OpenRouter boundary from lock
      run: uv sync --python 3.12.13 --extra api-openrouter --frozen
    - name: Run one-case budget-2 smoke
      env:
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      run: |
        test -n "$OPENROUTER_API_KEY" || { echo '::error::OPENROUTER_API_KEY missing'; exit 1; }
        uv run --python 3.12.13 python -m benchmarks.run_semantic_inversion \
          --llm-provider openrouter \
          --embedding-provider openrouter \
          --limit 1 \
          --budget 2 \
          --output benchmark_results/openrouter_smoke.json
    - name: Build smoke summary
      if: success()
      run: |
        uv run --python 3.12.13 python - <<'PY'
        import json
        from pathlib import Path
        d = json.loads(Path('benchmark_results/openrouter_smoke.json').read_text())
        assert d['case_count'] == 1
        assert d['budget'] == 2
        assert len(d['records']) == 3
        assert {r['evaluations'] for r in d['records']} == {2}
        cache = d.get('embedding_cache', {})
        lines = [
            '### OpenRouter live smoke: PASS',
            '',
            f"Embedding cache: {cache.get('cache_hits', 0)} hits / {cache.get('cache_misses', 0)} misses / {cache.get('cache_writes', 0)} writes",
            '',
            '| method | best similarity | LLM calls | evaluations |',
            '|---|---:|---:|---:|',
        ]
        for r in d['records']:
            lines.append(f"| `{r['method']}` | {r['best_target_similarity']:.6f} | {r['llm_calls']} | {r['evaluations']} |")
        Path('smoke_summary.md').write_text('\n'.join(lines) + '\n')
        print('\n'.join(lines))
        PY
    - name: Upload smoke artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: openrouter-live-smoke
        path: |
          benchmark_results/openrouter_smoke.json
          smoke_summary.md
        if-no-files-found: warn
        retention-days: 30
