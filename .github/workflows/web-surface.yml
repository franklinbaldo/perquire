name: Web surface

on:
  pull_request:
    branches: [main]
    paths:
      - "src/perquire/web/**"
      - "tests/test_web_surface.py"
      - ".github/workflows/web-surface.yml"
  push:
    branches: [main]
    paths:
      - "src/perquire/web/**"
      - "tests/test_web_surface.py"
      - ".github/workflows/web-surface.yml"

jobs:
  rendered-template-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight template test dependencies
        run: python -m pip install pytest Jinja2
      - name: Render and inspect the web surface
        run: pytest -q tests/test_web_surface.py
