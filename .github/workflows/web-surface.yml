name: Web surface

on:
  pull_request:
    branches: [main]
    paths:
      - "src/perquire/web/**"
      - "tests/test_web_surface.py"
      - ".github/workflows/web-surface.yml"
  push:
    branches: [main]
    paths:
      - "src/perquire/web/**"
      - "tests/test_web_surface.py"
      - ".github/workflows/web-surface.yml"

jobs:
  rendered-template-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.5'
          enable-cache: true
      - name: Sync web boundary from lock
        run: uv sync --python 3.12.13 --extra web --frozen
      - name: Render and inspect the web surface
        run: uv run --python 3.12.13 pytest -q tests/test_web_surface.py
