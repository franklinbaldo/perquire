name: OpenRouter reliability probe v1

# The v1 decision run is already captured in Actions artifacts. Keep the probe
# manually reproducible without re-running it on every follow-up commit.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.5'
          enable-cache: true
      - name: Require OpenRouter credential
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: test -n "${OPENROUTER_API_KEY}" || { echo '::error::OPENROUTER_API_KEY missing'; exit 1; }
      - name: Sync frozen OpenRouter boundary
        run: uv sync --python 3.12.13 --extra api-openrouter --frozen
      - name: Run target-free reliability probe
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          uv run --python 3.12.13 python -m benchmarks.probe_openrouter_reliability \
            --output benchmark_results/openrouter_reliability_probe_v1.json
      - name: Summarize frozen decision
        if: always()
        run: |
          if [ -f benchmark_results/openrouter_reliability_probe_v1.json ]; then
            uv run --python 3.12.13 python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('benchmark_results/openrouter_reliability_probe_v1.json').read_text())
          print('selected_model=', data['selected_model'])
          for row in data['results']:
              print(row['model'], 'success=', row['logical_successes'], '/', row['logical_calls'], 'transport=', row['transport_attempts'])
          PY
          fi
      - name: Upload reliability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openrouter-reliability-probe-v1
          path: benchmark_results/openrouter_reliability_probe_v1.json
          if-no-files-found: warn
          retention-days: 30
