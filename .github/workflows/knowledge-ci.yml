name: Knowledge CI

on:
  pull_request:
    paths:
      - "knowledge/**"
      - ".github/workflows/knowledge-ci.yml"
  push:
    branches: [main]
    paths:
      - "knowledge/**"
      - ".github/workflows/knowledge-ci.yml"

permissions:
  contents: read

jobs:
  okf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: franklinbaldo/okf-parser@v0.42.8
        with:
          path: knowledge
